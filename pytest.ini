[pytest]
testpaths = tests
# Disable an unrelated GenLayer pytest plugin (`genlayer-test` / gltest) if it
# happens to be installed globally on the machine running these tests — it
# auto-registers via entry_points and otherwise prints localnet config noise
# and creates an `artifacts/` directory that has nothing to do with this
# suite, which is a plain in-process mock (see tests/mock_genlayer.py) with
# no dependency on gltest or a running GenVM node.
addopts = -p no:gltest -p no:gltest_direct
